name: CI

# Local contracts use isolated Postgres/browser fixtures and no provider secrets.
# Dependency install/audits contact the public registry; offline gates do not.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-runtime:
    name: Node${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    # The 60 repository tests behind describe.skipIf(!databaseUrl) had no
    # execution path anywhere, so the SQL they cover was unverified on every
    # merge. This runs them.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kossilon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # db-migrate.ts and db-seed-annual-return.ts read DATABASE_URL; the
      # describe.skipIf blocks in the repository tests read TEST_DATABASE_URL.
      # Setting only one of them silently skips all 60 integration tests.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kossilon_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kossilon_test
      DATABASE_SSL: disable

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Scoped security overrides require the v3 lock format. Keep the
          # installer consistent with package.json and local verification.
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify selected runtimes
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) !== Number(process.env.EXPECTED_NODE_MAJOR)) throw new Error("Unexpected Node major"); console.log(process.version)'
          npm --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit both tracked dependency locks
        run: |
          bun audit --audit-level=low
          npm audit --audit-level=low

      - name: Verify portable npm lock installation
        run: |
          audit_npm_dir="$(mktemp -d)"
          # Exercise the exact tracked source with npm's own installation tree.
          # Keep the original Bun tree for every gate below.
          git archive HEAD | tar -x -C "$audit_npm_dir"
          (
            cd "$audit_npm_dir"
            npm ci --ignore-scripts
            npm run lint
            npm run typecheck
            npm run test -- src/server/dependency-security-f25.test.ts
          )

      - name: Apply migrations
        run: bun scripts/db-migrate.ts

      # The integration tests assert against reference rows — users, teams,
      # service packages — that only the seed creates. Without this they fail
      # rather than skip.
      - name: Seed reference data
        run: bun scripts/db-seed-annual-return.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Pre-deploy gate
        run: npm run verify:firm -- --dry-run

      - name: Original audit acceptance ledger (local contracts only)
        run: npm run verify:audit-release

      - name: Install isolated local browser
        run: bunx playwright install --with-deps chromium

      - name: Local demo browser and real parser regressions (not runtime UAT)
        run: npm run test:e2e:local

      # The scheduled handler only reaches the Worker through a nitro plugin, and
      # nothing but a real build proves the hook actually lands in the output.
      - name: Build
        run: npm run build

      # npm run build passing doesn't prove npm run dev works — dev mode skips
      # Rollup's tree-shaking, so a static import of server-only code that build
      # happily eliminates can still break every page in dev. This boots the real
      # dev server and requests every route to catch that class of regression.
      - name: Dev server import boundaries
        run: npm run verify:dev-server-imports

      - name: Cron trigger has a handler in the built Worker
        run: |
          grep -q 'hooks.hook("cloudflare:scheduled"' .output/server/index.mjs \
            || { echo "cloudflare:scheduled hook missing from the built Worker"; exit 1; }

  # Preserve the existing required-check name. Any failed, cancelled or skipped
  # runtime leg must keep this check red; neither leg is optional coverage.
  verify:
    needs: verify-runtime
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both Node runtime legs
        env:
          RUNTIME_RESULT: ${{ needs.verify-runtime.result }}
        run: test "$RUNTIME_RESULT" = success
