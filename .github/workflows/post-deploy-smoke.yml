name: Post-deploy smoke

# Two triggers:
#  - workflow_run pays attention to completed CI runs on main and waits for the
#    matching commit to be live before checking.
#  - schedule is the 24h monitor: it catches a deployment that later breaks, a
#    dead cron (/api/health returns 503) and host/CDN problems.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      include_health:
        description: "Include the maintenance/cron health alarm (scheduled runs do)"
        type: boolean
        default: false
      simulate_failure:
        description: "Fail on purpose to verify the alert path (opens an ops-alert issue)"
        type: boolean
        default: false

permissions:
  contents: read
  # Alerts are delivered as GitHub issues (which email watchers) so no external
  # webhook is required. SMOKE_ALERT_WEBHOOK remains an optional extra.
  issues: write

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify production is running latest main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/verify-production-freshness.ts

      - name: Wait for the deployed commit
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in $(seq 1 30); do
            sha="$(curl -fsS https://kossilon-hub.vercel.app/api/version | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).sha)}catch{console.log("")}})')"
            if [ "$sha" = "$EXPECTED_SHA" ]; then
              echo "production is $EXPECTED_SHA"
              exit 0
            fi
            echo "attempt $attempt: production sha=${sha:-unavailable} expected=$EXPECTED_SHA"
            sleep 20
          done
          echo "::error::production did not reach $EXPECTED_SHA within 10 minutes; the deploy may have failed"
          exit 1

      - name: Smoke production and demo
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          SMOKE_ALERT_WEBHOOK: ${{ secrets.SMOKE_ALERT_WEBHOOK }}
          INCLUDE_HEALTH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.include_health) }}
        run: |
          if [ "$INCLUDE_HEALTH" = "true" ]; then
            node --experimental-strip-types scripts/smoke-production.ts --expect-sha "$EXPECTED_SHA"
          else
            node --experimental-strip-types scripts/smoke-production.ts --expect-sha "$EXPECTED_SHA" --skip-health
          fi

      - name: Simulated failure (alert path test)
        if: github.event_name == 'workflow_dispatch' && inputs.simulate_failure
        run: |
          echo "::error::simulated smoke failure to verify the alert path"
          exit 1

      - name: Open or update operations alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Post-deploy smoke is failing"
          body="Post-deploy smoke failed on ${GITHUB_REF_NAME} at ${GITHUB_SHA}."$'\n\n'"Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"$'\n\n'"This issue is the default alert channel for the scheduled production/demo smoke and the five-minute maintenance tick. It is updated in place while failures continue; close it once green again."
          gh label create ops-alert --color B60205 --description "Automated operations alert" >/dev/null 2>&1 || true
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label ops-alert --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label ops-alert --body "$body"
          fi
